{% load static %}
<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | DCAS HelpDesk</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;margin:0;background:#111c2e;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif}.login-card{width:100%;max-width:440px;background:white;border-radius:16px;padding:32px}input{width:100%;padding:12px;border:1px solid #98a7bc;border-radius:8px}label{display:block;margin-bottom:8px}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #5593ff;outline-offset:3px}.errorlist{color:#a21c28}</style></head><body><main class="login-card"><div class="text-primary fw-bold mb-3">DCAS · HelpDesk</div><h1 class="h3">Entrar no suporte</h1><p class="text-secondary">Use sua conta para abrir e acompanhar chamados.</p>{% if form.errors %}<div class="alert alert-danger" role="alert">Confira seu usuário e sua senha.{{ form.non_field_errors }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="mb-3"><label for="id_username">Usuário</label><input id="id_username" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>{{ form.username.errors }}</div><div class="mb-4"><label for="id_password">Senha</label><input id="id_password" name="password" type="password" autocomplete="current-password" required>{{ form.password.errors }}</div><button type="submit" class="btn btn-primary w-100 py-3">Entrar</button></form></main></body></html>
